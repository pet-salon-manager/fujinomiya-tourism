<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf8f5">
<link rel="manifest" href="manifest.webmanifest">
<title>富士宮たびナビ</title>
<style>
:root{--ink:#12352e;--muted:#61746e;--card:#fff;--accent:#0a8069;--line:#d9e7e2;--bg:#eaf8f5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
.hero{min-height:520px;padding:56px 28px 34px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(rgba(0,45,39,.58),rgba(0,45,39,.62)),url("https://commons.wikimedia.org/wiki/Special:FilePath/%E5%AF%8C%E5%A3%AB%E5%B1%B1%E6%9C%AC%E5%AE%AE%E6%B5%85%E9%96%93%E5%A4%A7%E7%A4%BE%E9%B3%A5%E5%B1%85.JPG") center/cover no-repeat}
.wrap{width:min(760px,100%);margin:auto;padding:0 28px}
.kicker{font-size:14px;font-weight:800;letter-spacing:.08em}
h1{font-size:42px;line-height:1.05;margin:10px 0 18px;text-shadow:0 2px 12px #0007}
.lead{font-size:18px;line-height:1.8;margin:0 0 22px}
.hero button{width:100%}
button,.btn{border:0;border-radius:18px;padding:16px 18px;font-weight:800;font-size:16px;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
main.wrap{padding-top:28px;padding-bottom:90px}
.search{margin:8px 0 16px}
.search input{width:100%;border:1px solid var(--line);border-radius:22px;padding:18px 20px;font-size:17px;background:#fff}
.chips{display:flex;gap:10px;overflow:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:15px}
.chip.active{background:var(--ink);color:#fff}
.guide{background:#fff8e7;border:1px solid #efd9a5;border-radius:22px;padding:18px 20px;color:#667872;line-height:1.7;margin:12px 0 26px}
h2{font-size:28px;margin:24px 0 18px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 28px rgba(18,53,46,.06)}
.photo-wrap{position:relative;background:#dfe9e5}
.card-photo{width:100%;height:260px;object-fit:cover;display:block}
.photo-badge{position:absolute;left:18px;bottom:16px;background:rgba(0,0,0,.68);color:#fff;font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px}
.card-body{padding:22px 24px 24px}
.meta{font-size:14px;color:var(--accent);font-weight:800;margin-bottom:8px}
.card h3{font-size:24px;margin:0 54px 12px 0;line-height:1.35}
.desc{font-size:16px;line-height:1.85;color:var(--muted)}
.detail{font-size:14px;line-height:1.8;color:#51635e;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.fav{position:absolute;right:18px;top:18px;width:48px;height:48px;padding:0;border-radius:50%;font-size:24px;background:#fff;color:#0a93d8;border:1px solid var(--line);z-index:2}
.empty{text-align:center;color:var(--muted);padding:40px 20px;background:#fff;border-radius:22px}
.count{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:600px){
 .hero{min-height:500px;padding-left:0;padding-right:0}
 .wrap{padding-left:28px;padding-right:28px}
 h1{font-size:38px}
 .card-photo{height:220px}
 .row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="kicker">FUJINOMIYA CITY GUIDE</div>
    <h1>富士宮たびナビ</h1>
    <p class="lead">富士宮市の観光地・グルメ・温泉・宿泊・キャンプ場を、ホーム画面からそのまま見られる観光案内アプリです。</p>
    <button class="primary" onclick="nearby()">📍 現在地から探す</button>
  </div>
</header>

<main class="wrap">
  <div class="search"><input id="search" placeholder="白糸、朝霧、やきそば など"></div>
  <div class="chips" id="chips"></div>
  <div class="guide">観光地・飲食店・宿泊・温泉などは、このホーム画面に直接一覧表示します。カテゴリを押すと、このページ内の表示だけを絞り込みます。</div>

  <h2>おすすめスポット <span class="count" id="spotCount"></span></h2>
  <section class="grid" id="cards"></section>
</main>

<script>
let spots = [];
let selected = "すべて";
const cats = ["すべて","観光","自然","体験","グルメ","富士宮やきそば","飲食店","宿泊","温泉","キャンプ","学ぶ","登山","交通","お気に入り"];

const favs = () => JSON.parse(localStorage.getItem("favs") || "[]");

function saveFav(name){
  let f = favs();
  f = f.includes(name) ? f.filter(x => x !== name) : [...f, name];
  localStorage.setItem("favs", JSON.stringify(f));
  render();
}

function mapUrl(q){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q || "");
}

function dirUrl(q){
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q || "") + "&travelmode=driving";
}

function renderChips(){
  const el = document.getElementById("chips");
  el.innerHTML = cats.map(c =>
    `<button class="chip ${c===selected ? "active" : ""}" onclick="selected=${JSON.stringify(c)};renderChips();render()">${c}</button>`
  ).join("");
}

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const f = favs();

  const list = spots.filter(s => {
    const hay = [s.name,s.cat,s.area,s.desc,s.address].filter(Boolean).join(" ").toLowerCase();
    const textHit = !q || hay.includes(q);
    const catHit = selected === "すべて" || (selected === "お気に入り" ? f.includes(s.name) : s.cat === selected);
    return textHit && catHit;
  });

  document.getElementById("spotCount").textContent = `（${list.length}件 / 全${spots.length}件）`;

  document.getElementById("cards").innerHTML = list.length ? list.map(s => `
    <article class="card">
      <button class="fav" onclick='saveFav(${JSON.stringify(s.name)})'>${f.includes(s.name) ? "♥" : "♡"}</button>
      ${s.image ? `<div class="photo-wrap">
        <img class="card-photo" src="${s.image}" alt="${s.name}の画像" loading="lazy">
        <span class="photo-badge">${s.imageType === "illustration" ? "実写風イメージ" : "実写写真"}</span>
      </div>` : ""}
      <div class="card-body">
        <div class="meta">${s.cat || ""}${s.area ? ` ・ ${s.area}` : ""}</div>
        <h3>${s.name}</h3>
        <div class="desc">${s.desc || ""}</div>
        ${(s.address || s.phone) ? `<div class="detail">${s.address ? `📍 ${s.address}` : ""}${s.phone ? `<br>☎️ ${s.phone}` : ""}</div>` : ""}
        <div class="row">
          <a class="btn secondary" target="_blank" rel="noopener" href="${mapUrl(s.q || s.name + " 富士宮")}">地図</a>
          <a class="btn primary" target="_blank" rel="noopener" href="${dirUrl(s.q || s.name + " 富士宮")}">現在地から案内</a>
        </div>
      </div>
    </article>
  `).join("") : `<div class="empty">該当する施設がありません。</div>`;
}

function nearby(){
  if(!navigator.geolocation){
    alert("この端末では位置情報を利用できません。");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    () => window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("観光 富士宮市"), "_blank"),
    () => alert("位置情報の利用を許可すると、現在地から周辺を探せます。")
  );
}

fetch("./spots.json?rev=12", {cache:"no-store"})
  .then(r => {
    if(!r.ok) throw new Error("spots.json");
    return r.json();
  })
  .then(d => {
    spots = d;
    renderChips();
    render();
  })
  .catch(() => {
    document.getElementById("cards").innerHTML = `<div class="empty">施設データを読み込めませんでした。spots.json が同じ場所にアップロードされているか確認してください。</div>`;
  });

document.getElementById("search").addEventListener("input", render);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js?rev=12").catch(()=>{});
}
</script>
</body>
</html>
